# Läuft als unprivilegierter User (nginx-unprivileged) auf Port 8080.
# TLS übernimmt der Reverse-Proxy davor (z. B. Caddy/Traefik).
server_tokens off;

map $sent_http_content_type $cache_control {
  default                    "public, max-age=3600";
  ~*text/html                "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  absolute_redirect off;   # relative Weiterleitungen (hinter Reverse-Proxy)
  gzip on;
  gzip_types text/css image/svg+xml application/javascript;

  # Nur lesende Methoden erlaubt
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  # --- Sicherheits-Header ---
  add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control $cache_control always;

  # Gehashte Build-Assets dürfen lange gecacht werden
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  # Alte WordPress-URLs dauerhaft umleiten (Google & Lesezeichen)
  location = /contact        { return 301 /kontakt/; }
  location = /contact/       { return 301 /kontakt/; }
  location = /elementor-3488/ { return 301 /impressum/; }
  location = /elementor-3475/ { return 301 /datenschutz/; }

  # Typische Angriffs-Scans auf WordPress sofort abweisen
  location ~* ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php) { return 410; }
  location ~ /\. { return 404; }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
